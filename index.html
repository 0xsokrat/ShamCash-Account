<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الأرصدة والحسابات</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'Inter', 'sans-serif'],
            mono: ['Inter', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .num-font {
      font-family: 'Inter', 'Cairo', sans-serif;
      direction: ltr;
      display: inline-block;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 py-5 px-3">

  <div class="max-w-xl mx-auto space-y-4">

    <!-- شريط العنوان وزر الانتقال للإعدادات -->
    <div class="flex items-center justify-between">
      <h1 class="text-base font-extrabold text-white">لوحة الأرصدة والحسابات</h1>
      <a href="settings.html" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-slate-200 flex items-center gap-1.5 transition">
        <span>⚙️</span>
        <span>الإعدادات</span>
      </a>
    </div>

    <!-- 1. لوحة الملخص المدمجة بالأعلى -->
    <section class="bg-gradient-to-br from-slate-900 to-slate-950 border border-emerald-500/40 rounded-2xl p-4 shadow-xl space-y-3">
      
      <!-- الرصيد الكلي -->
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div>
          <span class="text-[11px] font-bold text-slate-400 block">الرصيد الكلي المجمع</span>
          <div class="flex items-center gap-3 mt-0.5">
            <span id="totalUsdDisplay" class="text-xl sm:text-2xl font-extrabold text-emerald-400 num-font">$0</span>
            <span class="text-slate-600">|</span>
            <span id="totalSypDisplay" class="text-lg sm:text-xl font-extrabold text-amber-400 num-font">0 SYP</span>
          </div>
        </div>
        <span id="activeAccountsBadge" class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">0 حسابات</span>
      </div>

      <!-- تفاصيل أرصدة الحسابات المفعلة -->
      <div class="space-y-1.5">
        <div class="flex items-center justify-between text-[11px] text-slate-400 px-1">
          <span>أرصدة الحسابات</span>
          <a href="settings.html" class="text-emerald-400 hover:underline">إدارة</a>
        </div>
        <div id="activeAccountsList" class="grid grid-cols-1 gap-1.5"></div>
      </div>

      <!-- إجمالي الإيداعات والسحوبات الكلية -->
      <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-800/80">
        <div class="bg-slate-950/70 border border-emerald-500/20 rounded-xl p-2.5 flex items-center justify-between">
          <div>
            <span class="text-[10px] text-slate-400 block">إجمالي الوارد</span>
            <span id="allTimeTotalDepositsUsd" class="text-xs font-extrabold text-emerald-400 num-font block">$0</span>
            <span id="allTimeTotalDepositsSyp" class="text-[10px] font-bold text-emerald-300 num-font block">0 SYP</span>
          </div>
          <span class="text-xs">➕</span>
        </div>
        <div class="bg-slate-950/70 border border-rose-500/20 rounded-xl p-2.5 flex items-center justify-between">
          <div>
            <span class="text-[10px] text-slate-400 block">إجمالي الصادر</span>
            <span id="allTimeTotalWithdrawsUsd" class="text-xs font-extrabold text-rose-400 num-font block">$0</span>
            <span id="allTimeTotalWithdrawsSyp" class="text-[10px] font-bold text-rose-300 num-font block">0 SYP</span>
          </div>
          <span class="text-xs">➖</span>
        </div>
      </div>

    </section>

    <!-- 2. خانة العمليات السريعة -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg">
      <div class="grid grid-cols-3 bg-slate-950/70 p-1 gap-1 border-b border-slate-800">
        <button id="modeDepositBtn" type="button" class="py-2 px-1 rounded-xl text-xs font-bold transition bg-emerald-600 text-white shadow">
          ➕ إيداع
        </button>
        <button id="modeWithdrawBtn" type="button" class="py-2 px-1 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white hover:bg-slate-800">
          ➖ سحب
        </button>
        <button id="modeTransferBtn" type="button" class="py-2 px-1 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white hover:bg-slate-800">
          🔄 نقل
        </button>
      </div>

      <form id="operationForm" class="p-4 space-y-3">
        <div class="grid grid-cols-3 gap-2.5">
          <div class="col-span-2">
            <label for="opAmount" class="block text-[11px] font-bold text-slate-300 mb-1">المبلغ</label>
            <input id="opAmount" type="number" step="any" min="0.01" required placeholder="0.00" class="w-full rounded-xl bg-slate-950 border border-slate-700 focus:border-emerald-500 focus:outline-none px-3 py-2 text-base font-extrabold text-white num-font" />
          </div>
          <div>
            <label for="opCurrency" class="block text-[11px] font-bold text-slate-300 mb-1">العملة</label>
            <select id="opCurrency" class="w-full rounded-xl bg-slate-950 border border-slate-700 focus:border-emerald-500 focus:outline-none px-2.5 py-2 text-xs font-bold text-emerald-400 h-[42px]">
              <option value="USD" selected>دولار ($)</option>
              <option value="SYP">سوري (ل.س)</option>
            </select>
          </div>
        </div>

        <div id="singleAccountBox">
          <label id="singleAccountLabel" for="opAccount" class="block text-[11px] font-bold text-slate-300 mb-1">الحساب</label>
          <select id="opAccount" class="w-full rounded-xl bg-slate-950 border border-slate-700 focus:border-emerald-500 focus:outline-none px-3 py-2 text-xs font-semibold text-white"></select>
        </div>

        <div id="transferAccountsBox" class="hidden grid grid-cols-1 sm:grid-cols-2 gap-2.5">
          <div>
            <label for="fromAccount" class="block text-[11px] font-bold text-slate-300 mb-1">من حساب</label>
            <select id="fromAccount" class="w-full rounded-xl bg-slate-950 border border-slate-700 focus:border-sky-500 focus:outline-none px-3 py-2 text-xs font-semibold text-white"></select>
          </div>
          <div>
            <label for="toAccount" class="block text-[11px] font-bold text-slate-300 mb-1">إلى حساب</label>
            <select id="toAccount" class="w-full rounded-xl bg-slate-950 border border-slate-700 focus:border-sky-500 focus:outline-none px-3 py-2 text-xs font-semibold text-white"></select>
          </div>
        </div>

        <div>
          <label for="opOpNumber" class="block text-[11px] font-bold text-slate-300 mb-1">رقم العملية / رقم السند (اختياري)</label>
          <input id="opOpNumber" type="text" placeholder="مثال: #1024 أو رقم الإيصال..." class="w-full rounded-xl bg-slate-950 border border-slate-700 focus:border-emerald-500 focus:outline-none px-3 py-2 text-xs text-white num-font" />
        </div>

        <button id="submitOpBtn" type="submit" class="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-md transition">
          تأكيد الإيداع وتحديث الرصيد
        </button>
      </form>
    </section>

    <!-- 3. السجل المنظم لكل حساب فعال ومقسّم حسب الأيام -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-3 shadow-lg">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2 flex-wrap gap-2">
        <h2 class="text-xs font-bold text-slate-200">📜 السجل المنظم للحسابات الفعالة</h2>
        <div class="flex items-center gap-1.5">
          <button id="exportReportBtn" type="button" class="px-2.5 py-1 rounded-lg bg-sky-600 hover:bg-sky-500 text-[10px] font-bold text-white transition">
            📥 تصدير التقرير الذكي
          </button>
          <button id="clearHistoryBtn" type="button" class="text-[10px] text-slate-400 hover:text-rose-400 transition">مسح</button>
        </div>
      </div>
      <div id="accountsHistoryContainer" class="space-y-4 max-h-[500px] overflow-y-auto"></div>
    </section>

  </div>

  <div id="toastBox" class="fixed bottom-4 left-4 z-50 hidden px-3 py-2 rounded-xl bg-slate-800 border border-emerald-500/40 text-white text-xs font-bold shadow-xl">
    <span id="toastText">تم التحديث</span>
  </div>

  <script>
    const STORAGE_KEY = 'simple_balance_mediator_v2';
    const DB_CONFIG_KEY = 'simple_balance_db_config_v1';

    const defaultState = {
      accounts: [
        { id: 'acc_1', name: 'حساب 1', usd: 1500, syp: 10000000, active: true },
        { id: 'acc_2', name: 'حساب 2', usd: 500, syp: 5000000, active: true }
      ],
      history: []
    };

    let state = loadState();
    let currentMode = 'deposit';
    let dbConfig = loadDbConfig();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.accounts)) return parsed;
        }
      } catch (e) {}
      return JSON.parse(JSON.stringify(defaultState));
    }

    function loadDbConfig() {
      try {
        const raw = localStorage.getItem(DB_CONFIG_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return { dbUrl: '', secretKey: 'my_balances' };
    }

    function getCloudEndpoint() {
      if (!dbConfig || !dbConfig.dbUrl) return null;
      const base = dbConfig.dbUrl.trim().replace(/\/+$/, '');
      const key = encodeURIComponent((dbConfig.secretKey || 'my_balances').trim());
      return `${base}/shamcash_${key}.json`;
    }

    async function pushStateToCloud() {
      const endpoint = getCloudEndpoint();
      if (!endpoint) return;
      try {
        await fetch(endpoint, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            accounts: state.accounts,
            history: state.history,
            updatedAt: Date.now()
          })
        });
      } catch (e) {}
    }

    async function pullStateFromCloud(silent) {
      const endpoint = getCloudEndpoint();
      if (!endpoint) return;
      try {
        const res = await fetch(endpoint);
        if (res.ok) {
          const data = await res.json();
          if (data && Array.isArray(data.accounts)) {
            state.accounts = data.accounts;
            state.history = Array.isArray(data.history) ? data.history : [];
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
            renderAll();
          }
        }
      } catch (e) {}
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      pushStateToCloud();
    }

    function showToast(msg) {
      const box = document.getElementById('toastBox');
      document.getElementById('toastText').textContent = msg;
      box.classList.remove('hidden');
      if (window._toastTimer) clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => box.classList.add('hidden'), 2500);
    }

    function formatUsd(val) {
      const n = Number(val) || 0;
      return '$' + n.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
    }

    function formatSyp(val) {
      const n = Number(val) || 0;
      return n.toLocaleString('en-US', { maximumFractionDigits: 0 }) + ' SYP';
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getActiveAccounts() {
      return state.accounts.filter(a => a.active);
    }

    function renderAll() {
      renderTopAndActiveAccounts();
      renderAccountSelects();
      renderHistory();
    }

    function renderTopAndActiveAccounts() {
      const activeAccs = getActiveAccounts();
      let totalUsd = 0;
      let totalSyp = 0;

      activeAccs.forEach(a => {
        totalUsd += Number(a.usd) || 0;
        totalSyp += Number(a.syp) || 0;
      });

      document.getElementById('totalUsdDisplay').textContent = formatUsd(totalUsd);
      document.getElementById('totalSypDisplay').textContent = formatSyp(totalSyp);
      document.getElementById('activeAccountsBadge').textContent = `${activeAccs.length} حسابات`;

      let depUsd = 0, depSyp = 0, wdUsd = 0, wdSyp = 0;
      (state.history || []).forEach(h => {
        const amt = Number(h.amount) || 0;
        if (h.type === 'deposit') {
          if (h.currency === 'USD') depUsd += amt; else depSyp += amt;
        } else if (h.type === 'withdraw') {
          if (h.currency === 'USD') wdUsd += amt; else wdSyp += amt;
        }
      });

      document.getElementById('allTimeTotalDepositsUsd').textContent = formatUsd(depUsd);
      document.getElementById('allTimeTotalDepositsSyp').textContent = formatSyp(depSyp);
      document.getElementById('allTimeTotalWithdrawsUsd').textContent = formatUsd(wdUsd);
      document.getElementById('allTimeTotalWithdrawsSyp').textContent = formatSyp(wdSyp);

      const list = document.getElementById('activeAccountsList');
      list.innerHTML = '';

      if (activeAccs.length === 0) {
        list.innerHTML = `<div class="bg-slate-950/70 border border-dashed border-slate-800 rounded-xl p-2 text-center text-[11px] text-slate-400">لا توجد حسابات مفعلة.</div>`;
        return;
      }

      activeAccs.forEach(acc => {
        const row = document.createElement('div');
        row.className = 'bg-slate-950/80 border border-slate-800 rounded-xl px-3 py-2 flex items-center justify-between gap-2';
        row.innerHTML = `
          <div class="flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
            <span class="text-xs font-bold text-white">${escapeHtml(acc.name)}</span>
          </div>
          <div class="flex items-center gap-2.5 text-xs">
            <span class="font-extrabold text-emerald-400 num-font">${formatUsd(acc.usd)}</span>
            <span class="text-slate-600">|</span>
            <span class="font-extrabold text-amber-400 num-font">${formatSyp(acc.syp)}</span>
          </div>
        `;
        list.appendChild(row);
      });
    }

    function renderAccountSelects() {
      const activeAccs = getActiveAccounts();
      const opSel = document.getElementById('opAccount');
      const fromSel = document.getElementById('fromAccount');
      const toSel = document.getElementById('toAccount');

      const prevOp = opSel.value;
      const prevFrom = fromSel.value;
      const prevTo = toSel.value;

      opSel.innerHTML = '';
      fromSel.innerHTML = '';
      toSel.innerHTML = '';

      activeAccs.forEach(acc => {
        const label = `${acc.name} (${formatUsd(acc.usd)} | ${formatSyp(acc.syp)})`;
        const o1 = document.createElement('option'); o1.value = acc.id; o1.textContent = label; opSel.appendChild(o1);
        const o2 = document.createElement('option'); o2.value = acc.id; o2.textContent = label; fromSel.appendChild(o2);
        const o3 = document.createElement('option'); o3.value = acc.id; o3.textContent = label; toSel.appendChild(o3);
      });

      if (prevOp && activeAccs.some(a => a.id === prevOp)) opSel.value = prevOp;
      if (prevFrom && activeAccs.some(a => a.id === prevFrom)) fromSel.value = prevFrom;
      if (prevTo && activeAccs.some(a => a.id === prevTo)) {
        toSel.value = prevTo;
      } else if (activeAccs.length > 1) {
        toSel.value = activeAccs[1].id;
      }
    }

    // تصميم سجل الحسابات المتقدم (مع فواصل الأيام)
    function renderHistory() {
      const container = document.getElementById('accountsHistoryContainer');
      container.innerHTML = '';

      const activeAccs = getActiveAccounts();

      if (!activeAccs || activeAccs.length === 0) {
        container.innerHTML = `<div class="text-[11px] text-slate-500 text-center py-2">لا توجد حسابات مفعلة لعرض سجلها</div>`;
        return;
      }

      activeAccs.forEach(acc => {
        const accItems = (state.history || []).filter(h => {
          if (h.type === 'deposit' || h.type === 'withdraw') return h.accountId === acc.id;
          if (h.type === 'transfer') return h.fromId === acc.id || h.toId === acc.id;
          return false;
        });

        const accBox = document.createElement('div');
        accBox.className = 'bg-slate-950/80 border border-slate-800 rounded-2xl p-3.5 space-y-3';

        let headerHtml = `<div class="flex items-center justify-between border-b border-slate-800 pb-2">
          <span class="font-extrabold text-sky-400 text-xs flex items-center gap-1.5">
            <span>📁</span> حساب: ${escapeHtml(acc.name)}
          </span>
          <span class="text-[10px] text-slate-300 bg-slate-900 border border-slate-800 px-2 py-0.5 rounded-md font-bold">${accItems.length} عملية</span>
        </div>`;

        if (accItems.length === 0) {
          accBox.innerHTML = headerHtml + `<div class="text-[11px] text-slate-500 text-center py-2">لا توجد حركات مسجلة لهذا الحساب بعد</div>`;
        } else {
          // تجميع عمليات الحساب حسب التاريخ (اليوم)
          const daysMap = {};
          accItems.forEach(h => {
            const ts = Number(h.id.replace('h_', '')) || Date.now();
            const dateObj = new Date(ts);
            const dateStr = h.date || dateObj.toLocaleDateString('en-CA');
            if (!daysMap[dateStr]) daysMap[dateStr] = [];
            daysMap[dateStr].push({ ...h, timeStr: dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false }) });
          });

          const sortedDays = Object.keys(daysMap).sort().reverse();
          let bodyHtml = '<div class="space-y-3">';

          sortedDays.forEach(day => {
            const dayItems = daysMap[day];
            bodyHtml += `
              <div class="bg-slate-900/90 border border-slate-800/80 rounded-xl p-2.5 space-y-2">
                <div class="flex items-center justify-between text-[11px] text-sky-300 font-bold border-b border-slate-800/60 pb-1">
                  <span>📅 تاريخ اليوم: ${day}</span>
                  <span class="text-[10px] bg-slate-950 px-2 py-0.5 rounded text-slate-400">${dayItems.length} حركات</span>
                </div>
                <div class="space-y-1.5">
            `;

            dayItems.forEach(h => {
              const amountStr = h.currency === 'USD' ? formatUsd(h.amount) : formatSyp(h.amount);
              let badge = '', desc = '';

              if (h.type === 'deposit') {
                badge = `<span class="text-emerald-400 font-bold">➕ إيداع</span>`;
                desc = `إيداع`;
              } else if (h.type === 'withdraw') {
                badge = `<span class="text-rose-400 font-bold">➖ سحب</span>`;
                desc = `سحب`;
              } else {
                if (h.fromId === acc.id) {
                  badge = `<span class="text-sky-400 font-bold">🔄 نقل صادر</span>`;
                  desc = `إلى ${escapeHtml(h.toName)}`;
                } else {
                  badge = `<span class="text-emerald-400 font-bold">🔄 نقل وارد</span>`;
                  desc = `من ${escapeHtml(h.fromName)}`;
                }
              }

              const opNumHtml = h.opNumber ? `<span class="text-sky-300 font-semibold bg-sky-500/10 px-2 py-0.5 rounded text-[10px] num-font">🔢 #${escapeHtml(h.opNumber)}</span>` : '';

              bodyHtml += `
                <div class="bg-slate-950 border border-slate-800/50 rounded-lg px-2.5 py-1.5 flex items-center justify-between text-xs gap-2">
                  <div class="flex items-center gap-2 flex-wrap">
                    ${badge}
                    <span class="font-extrabold text-white num-font">${amountStr}</span>
                    <span class="text-slate-400 text-[11px]">(${desc})</span>
                    ${opNumHtml}
                    <span class="text-[10px] text-slate-500 num-font">⏱ ${h.timeStr}</span>
                  </div>
                  <button type="button" data-undo-id="${h.id}" class="text-[10px] text-rose-400 hover:underline font-semibold whitespace-nowrap">تراجع</button>
                </div>
              `;
            });

            bodyHtml += `</div></div>`;
          });

          bodyHtml += '</div>';
          accBox.innerHTML = headerHtml + bodyHtml;
        }

        container.appendChild(accBox);
      });
    }

    function setMode(mode) {
      currentMode = mode;
      const depBtn = document.getElementById('modeDepositBtn');
      const wdBtn = document.getElementById('modeWithdrawBtn');
      const trBtn = document.getElementById('modeTransferBtn');
      const singleBox = document.getElementById('singleAccountBox');
      const transferBox = document.getElementById('transferAccountsBox');
      const singleLabel = document.getElementById('singleAccountLabel');
      const submitBtn = document.getElementById('submitOpBtn');

      const baseClass = 'py-2 px-1 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white hover:bg-slate-800';
      depBtn.className = baseClass; wdBtn.className = baseClass; trBtn.className = baseClass;

      if (mode === 'deposit') {
        depBtn.className = 'py-2 px-1 rounded-xl text-xs font-bold transition bg-emerald-600 text-white shadow';
        singleBox.classList.remove('hidden'); transferBox.classList.add('hidden');
        singleLabel.textContent = 'إيداع في حساب';
        submitBtn.textContent = 'تأكيد الإيداع وتحديث الرصيد';
        submitBtn.className = 'w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-md transition';
      } else if (mode === 'withdraw') {
        wdBtn.className = 'py-2 px-1 rounded-xl text-xs font-bold transition bg-rose-600 text-white shadow';
        singleBox.classList.remove('hidden'); transferBox.classList.add('hidden');
        singleLabel.textContent = 'سحب من حساب';
        submitBtn.textContent = 'تأكيد السحب وتحديث الرصيد';
        submitBtn.className = 'w-full py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs shadow-md transition';
      } else {
        trBtn.className = 'py-2 px-1 rounded-xl text-xs font-bold transition bg-sky-600 text-white shadow';
        singleBox.classList.add('hidden'); transferBox.classList.remove('hidden');
        submitBtn.textContent = 'تأكيد النقل بين الحسابين';
        submitBtn.className = 'w-full py-2.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs shadow-md transition';
      }
    }

    document.getElementById('modeDepositBtn').addEventListener('click', () => setMode('deposit'));
    document.getElementById('modeWithdrawBtn').addEventListener('click', () => setMode('withdraw'));
    document.getElementById('modeTransferBtn').addEventListener('click', () => setMode('transfer'));

    document.getElementById('operationForm').addEventListener('submit', e => {
      e.preventDefault();
      const amount = parseFloat(document.getElementById('opAmount').value);
      const currency = document.getElementById('opCurrency').value;
      const opNumber = document.getElementById('opOpNumber').value.trim();
      if (!amount || amount <= 0) return;

      const nowTimestamp = Date.now();
      const nowDate = new Date(nowTimestamp).toLocaleDateString('en-CA');

      if (currentMode === 'deposit' || currentMode === 'withdraw') {
        const accId = document.getElementById('opAccount').value;
        const acc = state.accounts.find(a => a.id === accId);
        if (!acc) return;

        const delta = currentMode === 'deposit' ? amount : -amount;
        if (currency === 'USD') {
          acc.usd = Number((Number(acc.usd || 0) + delta).toFixed(2));
        } else {
          acc.syp = Math.round(Number(acc.syp || 0) + delta);
        }

        state.history.unshift({
          id: 'h_' + nowTimestamp,
          date: nowDate,
          type: currentMode,
          amount,
          currency,
          opNumber,
          accountId: acc.id,
          accountName: acc.name
        });
        showToast(currentMode === 'deposit' ? 'تمت إضافة المبلغ للرصيد' : 'تم خصم المبلغ من الرصيد');
      } else if (currentMode === 'transfer') {
        const fromId = document.getElementById('fromAccount').value;
        const toId = document.getElementById('toAccount').value;
        if (!fromId || !toId || fromId === toId) {
          showToast('يرجى اختيار حسابين مختلفين للنقل بينهما');
          return;
        }

        const fromAcc = state.accounts.find(a => a.id === fromId);
        const toAcc = state.accounts.find(a => a.id === toId);
        if (!fromAcc || !toAcc) return;

        if (currency === 'USD') {
          fromAcc.usd = Number((Number(fromAcc.usd || 0) - amount).toFixed(2));
          toAcc.usd = Number((Number(toAcc.usd || 0) + amount).toFixed(2));
        } else {
          fromAcc.syp = Math.round(Number(fromAcc.syp || 0) - amount);
          toAcc.syp = Math.round(Number(fromAcc.syp || 0) + amount);
        }

        state.history.unshift({
          id: 'h_' + nowTimestamp,
          date: nowDate,
          type: 'transfer',
          amount,
          currency,
          opNumber,
          fromId: fromAcc.id,
          fromName: fromAcc.name,
          toId: toAcc.id,
          toName: toAcc.name
        });
        showToast(`تم نقل المبلغ من ${fromAcc.name} إلى ${toAcc.name}`);
      }

      saveState();
      renderAll();
      document.getElementById('opAmount').value = '';
      document.getElementById('opOpNumber').value = '';
      document.getElementById('opCurrency').value = 'USD';
    });

    document.getElementById('accountsHistoryContainer').addEventListener('click', e => {
      const btn = e.target.closest('button[data-undo-id]');
      if (!btn) return;
      const id = btn.getAttribute('data-undo-id');
      const item = state.history.find(h => h.id === id);
      if (!item) return;

      if (item.type === 'deposit' || item.type === 'withdraw') {
        const acc = state.accounts.find(a => a.id === item.accountId);
        if (acc) {
          const reverseDelta = item.type === 'deposit' ? -item.amount : item.amount;
          if (item.currency === 'USD') acc.usd = Number((Number(acc.usd || 0) + reverseDelta).toFixed(2));
          else acc.syp = Math.round(Number(acc.syp || 0) + reverseDelta);
        }
      } else if (item.type === 'transfer') {
        const fromAcc = state.accounts.find(a => a.id === item.fromId);
        const toAcc = state.accounts.find(a => a.id === item.toId);
        if (fromAcc) {
          if (item.currency === 'USD') fromAcc.usd = Number((Number(fromAcc.usd || 0) + item.amount).toFixed(2));
          else fromAcc.syp = Math.round(Number(fromAcc.syp || 0) + item.amount);
        }
        if (toAcc) {
          if (item.currency === 'USD') toAcc.usd = Number((Number(toAcc.usd || 0) - item.amount).toFixed(2));
          else toAcc.syp = Math.round(Number(toAcc.syp || 0) - item.amount);
        }
      }

      state.history = state.history.filter(h => h.id !== id);
      saveState(); renderAll();
      showToast('تم التراجع عن العملية');
    });

    document.getElementById('clearHistoryBtn').addEventListener('click', () => {
      state.history = [];
      saveState(); renderHistory();
      showToast('تم مسح السجل');
    });

    // تصدير التقرير الذكي مقسماً بالأيام مع عدد عمليات السحب والإيداع وأرقام العمليات
    document.getElementById('exportReportBtn').addEventListener('click', () => {
      if (!state.history || state.history.length === 0) {
        showToast('لا توجد عمليات لتصديرها');
        return;
      }

      let reportText = "====================================\n";
      reportText += "      تقرير الأرصدة والملخص المالي      \n";
      reportText += "====================================\n\n";

      reportText += "--- أرصدة الحسابات الفعالة الحالية ---\n";
      state.accounts.filter(a => a.active).forEach(acc => {
        reportText += `• ${acc.name}: USD ${acc.usd} | SYP ${acc.syp}\n`;
      });
      reportText += "\n";

      reportText += "--- سجل العمليات مفصلاً حسب الحسابات والأيام ---\n";
      getActiveAccounts().forEach(acc => {
        const accItems = state.history.filter(h => {
          if (h.type === 'deposit' || h.type === 'withdraw') return h.accountId === acc.id;
          if (h.type === 'transfer') return h.fromId === acc.id || h.toId === acc.id;
          return false;
        });

        reportText += `\n[ حساب: ${acc.name} ] (إجمالي العمليات: ${accItems.length})\n`;
        reportText += `----------------------------------------\n`;

        // تجميع عمليات هذا الحساب حسب الأيام
        const dayMap = {};
        accItems.forEach(h => {
          const ts = Number(h.id.replace('h_', '')) || Date.now();
          const dateObj = new Date(ts);
          const dateStr = h.date || dateObj.toLocaleDateString('en-CA');
          if (!dayMap[dateStr]) dayMap[dateStr] = [];
          dayMap[dateStr].push({ ...h, timeStr: dateObj.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false }) });
        });

        const sortedDays = Object.keys(dayMap).sort().reverse();
        sortedDays.forEach(day => {
          const dayOps = dayMap[day];
          const depositsCount = dayOps.filter(o => o.type === 'deposit').length;
          const withdrawsCount = dayOps.filter(o => o.type === 'withdraw').length;
          const transfersCount = dayOps.filter(o => o.type === 'transfer').length;

          reportText += `  📅 تاريخ اليوم: ${day}\n`;
          reportText += `     * عدد عمليات الإيداع: ${depositsCount}\n`;
          reportText += `     * عدد عمليات السحب: ${withdrawsCount}\n`;
          if (transfersCount > 0) reportText += `     * عدد عمليات النقل: ${transfersCount}\n`;
          reportText += `     التفاصيل:\n`;

          dayOps.forEach((h, idx) => {
            const opNumStr = h.opNumber ? ` [رقم العملية: #${h.opNumber}]` : '';
            if (h.type === 'deposit') {
              reportText += `       ${idx + 1}. [إيداع] ${h.timeStr} - المبلغ: ${h.amount} ${h.currency}${opNumStr}\n`;
            } else if (h.type === 'withdraw') {
              reportText += `       ${idx + 1}. [سحب] ${h.timeStr} - المبلغ: ${h.amount} ${h.currency}${opNumStr}\n`;
            } else {
              const dir = h.fromId === acc.id ? `إلى ${h.toName}` : `من ${h.fromName}`;
              reportText += `       ${idx + 1}. [نقل] ${h.timeStr} - المبلغ: ${h.amount} ${h.currency} (${dir})${opNumStr}\n`;
            }
          });
          reportText += `\n`;
        });
      });

      const blob = new Blob([reportText], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ShamCash_Report_${new Date().toISOString().slice(0, 10)}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      showToast('تم تصدير التقرير الذكي بنجاح ✓');
    });

    renderAll();
    if (dbConfig.dbUrl) {
      fetch(`${dbConfig.dbUrl.trim().replace(/\/+$/, '')}/shamcash_${encodeURIComponent(dbConfig.secretKey || 'my_balances')}.json`)
        .then(res => res.json())
        .then(data => {
          if (data && Array.isArray(data.accounts)) {
            state.accounts = data.accounts;
            state.history = Array.isArray(data.history) ? data.history : [];
            renderAll();
          }
        }).catch(e => {});
    }
  </script>
</body>
</html>
