<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة الأرصدة والحسابات</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'Inter', 'sans-serif'],
            mono: ['Inter', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .num-font {
      font-family: 'Inter', 'Cairo', sans-serif;
      direction: ltr;
      display: inline-block;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 py-5 px-3">

  <div class="max-w-xl mx-auto space-y-4">

    <!-- شريط العنوان وزر الإعدادات -->
    <div class="flex items-center justify-between gap-2">
      <h1 class="text-base font-extrabold text-white">لوحة الأرصدة والحسابات</h1>
      <a href="settings.html" class="px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-slate-200 flex items-center gap-1.5 transition">
        <span>⚙️</span>
        <span>الإعدادات</span>
      </a>
    </div>

    <!-- 1. لوحة الملخص المدمجة بالأعلى -->
    <section class="bg-gradient-to-br from-slate-900 to-slate-950 border border-emerald-500/40 rounded-2xl p-4 shadow-xl space-y-3">
      
      <!-- الرصيد الكلي -->
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div>
          <span class="text-[11px] font-bold text-slate-400 block">إجمالي أرصدة الحسابات المفعلة</span>
          <div class="flex items-center gap-3 mt-0.5">
            <span id="totalUsdDisplay" class="text-xl sm:text-2xl font-extrabold text-emerald-400 num-font">$0</span>
            <span class="text-slate-600">|</span>
            <span id="totalSypDisplay" class="text-lg sm:text-xl font-extrabold text-amber-400 num-font">0 SYP</span>
          </div>
        </div>
        <span id="activeAccountsBadge" class="text-[10px] font-bold px-2.5 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">0 حسابات</span>
      </div>

      <!-- خانة: لنا من الشركة (تعديل يدوي) -->
      <div class="bg-slate-950/90 border border-sky-500/30 rounded-xl p-3 space-y-2">
        <div class="flex items-center justify-between">
          <span class="text-xs font-extrabold text-sky-400">📥 لنا من الشركة (يدوي)</span>
          <button id="saveCompanyOwedBtn" type="button" class="text-[10px] font-bold bg-sky-600 hover:bg-sky-500 text-white px-3 py-0.5 rounded-lg transition shadow">
            حفظ
          </button>
        </div>
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="text-[10px] text-slate-400 block mb-0.5">دولار ($)</label>
            <input id="companyOwedUsdInput" type="number" step="any" placeholder="0" class="w-full rounded-lg bg-slate-900 border border-slate-700 focus:border-sky-500 focus:outline-none px-2.5 py-1.5 text-sm font-extrabold text-sky-300 num-font" />
          </div>
          <div>
            <label class="text-[10px] text-slate-400 block mb-0.5">سوري (SYP)</label>
            <input id="companyOwedSypInput" type="number" step="any" placeholder="0" class="w-full rounded-lg bg-slate-900 border border-slate-700 focus:border-sky-500 focus:outline-none px-2.5 py-1.5 text-sm font-extrabold text-amber-300 num-font" />
          </div>
        </div>
      </div>

      <!-- تفاصيل أرصدة الحسابات المفعلة -->
      <div class="space-y-1.5 pt-1">
        <div class="flex items-center justify-between text-[11px] text-slate-400 px-1">
          <span>أرصدة الحسابات</span>
          <a href="settings.html" class="text-emerald-400 hover:underline">إدارة</a>
        </div>
        <div id="activeAccountsList" class="grid grid-cols-1 gap-1.5"></div>
      </div>

      <!-- إجمالي الإيداعات والسحوبات الكلية -->
      <div class="grid grid-cols-2 gap-2 pt-2 border-t border-slate-800/80">
        <div class="bg-slate-950/70 border border-emerald-500/20 rounded-xl p-2.5 flex items-center justify-between">
          <div>
            <span class="text-[10px] text-slate-400 block">إجمالي الإيداعات</span>
            <span id="allTimeTotalDepositsUsd" class="text-sm font-extrabold text-emerald-400 num-font block mt-0.5">$0</span>
            <span id="allTimeTotalDepositsSyp" class="text-[10px] font-bold text-emerald-300 num-font block">0 SYP</span>
          </div>
          <span class="text-xs">➕</span>
        </div>
        <div class="bg-slate-950/70 border border-rose-500/20 rounded-xl p-2.5 flex items-center justify-between">
          <div>
            <span class="text-[10px] text-slate-400 block">إجمالي السحوبات</span>
            <span id="allTimeTotalWithdrawsUsd" class="text-sm font-extrabold text-rose-400 num-font block mt-0.5">$0</span>
            <span id="allTimeTotalWithdrawsSyp" class="text-[10px] font-bold text-rose-300 num-font block">0 SYP</span>
          </div>
          <span class="text-xs">➖</span>
        </div>
      </div>

    </section>

    <!-- 2. خانة العمليات السريعة (مع خانة اختيار التاريخ القديم) -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-lg">
      <div class="grid grid-cols-3 bg-slate-950/70 p-1 gap-1 border-b border-slate-800">
        <button id="modeDepositBtn" type="button" class="py-2 px-1 rounded-xl text-xs font-bold transition bg-emerald-600 text-white shadow">
          ➕ إيداع
        </button>
        <button id="modeWithdrawBtn" type="button" class="py-2 px-1 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white hover:bg-slate-800">
          ➖ سحب
        </button>
        <button id="modeTransferBtn" type="button" class="py-2 px-1 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white hover:bg-slate-800">
          🔄 نقل
        </button>
      </div>

      <form id="operationForm" class="p-4 space-y-3">
        <!-- خانة اختيار تاريخ العملية (تاريخ سابقة أو اليوم) -->
        <div class="bg-slate-950/90 border border-sky-500/30 rounded-xl p-2.5 flex items-center justify-between gap-2">
          <label for="opDate" class="text-xs font-bold text-sky-300 flex items-center gap-1.5">
            <span>📅</span>
            <span>تاريخ العملية:</span>
          </label>
          <input id="opDate" type="date" class="rounded-lg bg-slate-900 border border-slate-700 text-xs font-bold text-white px-2.5 py-1.5 num-font focus:border-sky-500 focus:outline-none" />
        </div>

        <div class="grid grid-cols-3 gap-2.5">
          <div class="col-span-2">
            <label for="opAmount" class="block text-[11px] font-bold text-slate-300 mb-1">المبلغ</label>
            <input id="opAmount" type="number" step="any" min="0.01" required placeholder="0.00" class="w-full rounded-xl bg-slate-950 border border-slate-700 focus:border-emerald-500 focus:outline-none px-3 py-2 text-base font-extrabold text-white num-font" />
          </div>
          <div>
            <label for="opCurrency" class="block text-[11px] font-bold text-slate-300 mb-1">العملة</label>
            <select id="opCurrency" class="w-full rounded-xl bg-slate-950 border border-slate-700 focus:border-emerald-500 focus:outline-none px-2.5 py-2 text-xs font-bold text-emerald-400 h-[42px]">
              <option value="USD" selected>دولار ($)</option>
              <option value="SYP">سوري (ل.س)</option>
            </select>
          </div>
        </div>

        <div id="singleAccountBox">
          <label id="singleAccountLabel" for="opAccount" class="block text-[11px] font-bold text-slate-300 mb-1">الحساب</label>
          <select id="opAccount" class="w-full rounded-xl bg-slate-950 border border-slate-700 focus:border-emerald-500 focus:outline-none px-3 py-2 text-xs font-semibold text-white"></select>
        </div>

        <div id="transferAccountsBox" class="hidden grid grid-cols-1 sm:grid-cols-2 gap-2.5">
          <div>
            <label for="fromAccount" class="block text-[11px] font-bold text-slate-300 mb-1">من حساب</label>
            <select id="fromAccount" class="w-full rounded-xl bg-slate-950 border border-slate-700 focus:border-sky-500 focus:outline-none px-3 py-2 text-xs font-semibold text-white"></select>
          </div>
          <div>
            <label for="toAccount" class="block text-[11px] font-bold text-slate-300 mb-1">إلى حساب</label>
            <select id="toAccount" class="w-full rounded-xl bg-slate-950 border border-slate-700 focus:border-sky-500 focus:outline-none px-3 py-2 text-xs font-semibold text-white"></select>
          </div>
        </div>

        <div>
          <label for="opOpNumber" class="block text-[11px] font-bold text-slate-300 mb-1">رقم العملية / رقم السند (اختياري)</label>
          <input id="opOpNumber" type="text" placeholder="مثال: 1024 أو رقم الإيصال..." class="w-full rounded-xl bg-slate-950 border border-slate-700 focus:border-emerald-500 focus:outline-none px-3 py-2 text-xs text-white num-font" />
        </div>

        <div id="excludeFromTotalBox" class="bg-slate-950/90 border border-slate-800 rounded-xl px-3 py-2">
          <label class="flex items-center gap-2 cursor-pointer select-none">
            <input id="excludeFromTotalCheckbox" type="checkbox" class="w-4 h-4 rounded accent-amber-500 cursor-pointer" />
            <span class="text-[11px] font-bold text-slate-300">استثناء هذه الحركة من إجمالي الإيداعات/السحوبات</span>
          </label>
        </div>

        <button id="submitOpBtn" type="submit" class="w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-md transition">
          تأكيد الإيداع وتحديث الرصيد
        </button>
      </form>
    </section>

    <!-- 3. السجل التفاعلي -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 space-y-3 shadow-lg">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2.5 flex-wrap gap-2">
        <h2 class="text-xs font-bold text-slate-200">📜 سجل العمليات حسب الحساب</h2>
        <div class="flex items-center gap-1.5 flex-wrap">
          <input id="exportDateInput" type="date" class="rounded-lg bg-slate-950 border border-slate-700 text-[11px] text-white px-2 py-1 num-font" title="اختر اليوم للتصدير" />
          <button id="exportReportBtn" type="button" class="px-2.5 py-1 rounded-lg bg-sky-600 hover:bg-sky-500 text-[10px] font-bold text-white transition">
            📥 تصدير تقرير اليوم المختار
          </button>
          <button id="clearHistoryBtn" type="button" class="text-[10px] text-slate-400 hover:text-rose-400 transition">مسح</button>
        </div>
      </div>

      <!-- أزرار اختيار الحساب -->
      <div id="accountTabsContainer" class="flex items-center gap-1.5 overflow-x-auto pb-1"></div>

      <!-- شريط البحث -->
      <div class="relative">
        <input id="historySearchInput" type="text" placeholder="🔍 ابحث برقم العملية أو المبلغ..." class="w-full rounded-xl bg-slate-950 border border-slate-800 focus:border-sky-500 focus:outline-none px-3 py-2 text-xs text-white" />
      </div>

      <div id="accountsHistoryContainer" class="space-y-3 max-h-[460px] overflow-y-auto"></div>
    </section>

  </div>

  <div id="toastBox" class="fixed bottom-4 left-4 z-50 hidden px-3 py-2 rounded-xl bg-slate-800 border border-emerald-500/40 text-white text-xs font-bold shadow-xl">
    <span id="toastText">تم التحديث</span>
  </div>

  <script>
    const STORAGE_KEY = 'simple_balance_mediator_v2';
    const OLD_KEYS = ['simple_balance_mediator_v1', 'shamcash_state', 'balances_state'];
    const DB_CONFIG_KEY = 'simple_balance_db_config_v1';

    const defaultState = {
      accounts: [
        { id: 'acc_1', name: 'حساب 1', usd: 0, syp: 0, active: true },
        { id: 'acc_2', name: 'حساب 2', usd: 0, syp: 0, active: true }
      ],
      history: [],
      companyOwedUsd: 0,
      companyOwedSyp: 0,
      initialDepositUsd: 0,
      initialDepositSyp: 0,
      initialWithdrawUsd: 0,
      initialWithdrawSyp: 0
    };

    let state = loadState();
    let currentMode = 'deposit';
    let dbConfig = loadDbConfig();
    let selectedHistoryAccId = 'ALL';
    let searchQuery = '';

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.accounts)) {
            parsed.history = Array.isArray(parsed.history) ? parsed.history : [];
            parsed.companyOwedUsd = Number(parsed.companyOwedUsd) || 0;
            parsed.companyOwedSyp = Number(parsed.companyOwedSyp) || 0;
            parsed.initialDepositUsd = Number(parsed.initialDepositUsd) || 0;
            parsed.initialDepositSyp = Number(parsed.initialDepositSyp) || 0;
            parsed.initialWithdrawUsd = Number(parsed.initialWithdrawUsd) || 0;
            parsed.initialWithdrawSyp = Number(parsed.initialWithdrawSyp) || 0;
            return parsed;
          }
        }
      } catch (e) {}
      return JSON.parse(JSON.stringify(defaultState));
    }

    function loadDbConfig() {
      try {
        const raw = localStorage.getItem(DB_CONFIG_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return { dbUrl: '', secretKey: 'my_balances' };
    }

    function getCloudEndpoint() {
      if (!dbConfig || !dbConfig.dbUrl) return null;
      const base = dbConfig.dbUrl.trim().replace(/\/+$/, '');
      const key = encodeURIComponent((dbConfig.secretKey || 'my_balances').trim());
      return `${base}/shamcash_${key}.json`;
    }

    async function pushStateToCloud() {
      const endpoint = getCloudEndpoint();
      if (!endpoint) return;
      try {
        await fetch(endpoint, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ...state, updatedAt: Date.now() })
        });
      } catch (e) {}
    }

    async function pullStateFromCloud() {
      const endpoint = getCloudEndpoint();
      if (!endpoint) return;
      try {
        const res = await fetch(endpoint);
        if (res.ok) {
          const data = await res.json();
          if (data && Array.isArray(data.accounts)) {
            state.accounts = data.accounts;
            const cloudHist = Array.isArray(data.history) ? data.history : [];
            const localHist = Array.isArray(state.history) ? state.history : [];
            const mergedMap = new Map();
            [...cloudHist, ...localHist].forEach(item => {
              if (item && item.id) mergedMap.set(item.id, item);
            });
            state.history = Array.from(mergedMap.values()).sort((a, b) => {
              const tA = Number(String(a.id).replace('h_', '')) || 0;
              const tB = Number(String(b.id).replace('h_', '')) || 0;
              return tB - tA;
            });

            if (data.companyOwedUsd !== undefined) state.companyOwedUsd = Number(data.companyOwedUsd) || 0;
            if (data.companyOwedSyp !== undefined) state.companyOwedSyp = Number(data.companyOwedSyp) || 0;
            if (data.initialDepositUsd !== undefined) state.initialDepositUsd = Number(data.initialDepositUsd) || 0;
            if (data.initialDepositSyp !== undefined) state.initialDepositSyp = Number(data.initialDepositSyp) || 0;
            if (data.initialWithdrawUsd !== undefined) state.initialWithdrawUsd = Number(data.initialWithdrawUsd) || 0;
            if (data.initialWithdrawSyp !== undefined) state.initialWithdrawSyp = Number(data.initialWithdrawSyp) || 0;
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
            renderAll();
          }
        }
      } catch (e) {}
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      pushStateToCloud();
    }

    function showToast(msg) {
      const box = document.getElementById('toastBox');
      document.getElementById('toastText').textContent = msg;
      box.classList.remove('hidden');
      if (window._toastTimer) clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => box.classList.add('hidden'), 2500);
    }

    function formatUsd(val) {
      const n = Number(val) || 0;
      const sign = n < 0 ? '-' : '';
      return sign + '$' + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
    }

    function formatSyp(val) {
      const n = Number(val) || 0;
      return n.toLocaleString('en-US', { maximumFractionDigits: 0 }) + ' SYP';
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function getActiveAccounts() {
      return state.accounts.filter(a => a.active);
    }

    function doesItemBelongToAccount(h, acc) {
      if (!h || !acc) return false;
      const accNameTrim = String(acc.name || '').trim();
      if (h.type === 'transfer') {
        return h.fromId === acc.id || h.toId === acc.id || String(h.fromName || '').trim() === accNameTrim || String(h.toName || '').trim() === accNameTrim;
      }
      return h.accountId === acc.id || String(h.accountName || '').trim() === accNameTrim;
    }

    function computeFinalTotals() {
      let histDepUsd = 0, histDepSyp = 0, histWdUsd = 0, histWdSyp = 0;
      (state.history || []).forEach(h => {
        if (h.excludeFromTotal) return;
        const amt = Number(h.amount) || 0;
        if (h.type === 'deposit') {
          if (h.currency === 'USD') histDepUsd += amt; else histDepSyp += amt;
        } else if (h.type === 'withdraw') {
          if (h.currency === 'USD') histWdUsd += amt; else histWdSyp += amt;
        }
      });

      const finalDepUsd = (Number(state.initialDepositUsd) || 0) + histDepUsd;
      const finalDepSyp = (Number(state.initialDepositSyp) || 0) + histDepSyp;
      const finalWdUsd = (Number(state.initialWithdrawUsd) || 0) + histWdUsd;
      const finalWdSyp = (Number(state.initialWithdrawSyp) || 0) + histWdSyp;

      return {
        depUsd: Math.max(0, finalDepUsd),
        depSyp: Math.max(0, finalDepSyp),
        wdUsd: Math.max(0, finalWdUsd),
        wdSyp: Math.max(0, finalWdSyp)
      };
    }

    function renderAll() {
      renderTopAndActiveAccounts();
      renderAccountSelects();
      renderHistory();
    }

    function renderTopAndActiveAccounts() {
      const activeAccs = getActiveAccounts();
      let totalUsd = 0;
      let totalSyp = 0;

      activeAccs.forEach(a => {
        totalUsd += Number(a.usd) || 0;
        totalSyp += Number(a.syp) || 0;
      });

      document.getElementById('totalUsdDisplay').textContent = formatUsd(totalUsd);
      document.getElementById('totalSypDisplay').textContent = formatSyp(totalSyp);
      document.getElementById('activeAccountsBadge').textContent = `${activeAccs.length} حسابات`;

      const owedUsd = Number(state.companyOwedUsd) || 0;
      const owedSyp = Number(state.companyOwedSyp) || 0;

      const usdInput = document.getElementById('companyOwedUsdInput');
      const sypInput = document.getElementById('companyOwedSypInput');
      if (document.activeElement !== usdInput) usdInput.value = owedUsd || '';
      if (document.activeElement !== sypInput) sypInput.value = owedSyp || '';

      const totals = computeFinalTotals();
      document.getElementById('allTimeTotalDepositsUsd').textContent = formatUsd(totals.depUsd);
      document.getElementById('allTimeTotalDepositsSyp').textContent = formatSyp(totals.depSyp);
      document.getElementById('allTimeTotalWithdrawsUsd').textContent = formatUsd(totals.wdUsd);
      document.getElementById('allTimeTotalWithdrawsSyp').textContent = formatSyp(totals.wdSyp);

      const list = document.getElementById('activeAccountsList');
      list.innerHTML = '';

      if (activeAccs.length === 0) {
        list.innerHTML = `<div class="bg-slate-950/70 border border-dashed border-slate-800 rounded-xl p-2 text-center text-[11px] text-slate-400">لا توجد حسابات مفعلة.</div>`;
        return;
      }

      activeAccs.forEach(acc => {
        const row = document.createElement('div');
        row.className = 'bg-slate-950/80 border border-slate-800 rounded-xl px-3 py-2 flex items-center justify-between gap-2';
        row.innerHTML = `
          <div class="flex items-center gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
            <span class="text-xs font-bold text-white">${escapeHtml(acc.name)}</span>
          </div>
          <div class="flex items-center gap-2.5 text-xs">
            <span class="font-extrabold text-emerald-400 num-font">${formatUsd(acc.usd)}</span>
            <span class="text-slate-600">|</span>
            <span class="font-extrabold text-amber-400 num-font">${formatSyp(acc.syp)}</span>
          </div>
        `;
        list.appendChild(row);
      });
    }

    function handleCompanyOwedChange(showNotification) {
      const valUsd = parseFloat(document.getElementById('companyOwedUsdInput').value) || 0;
      const valSyp = parseFloat(document.getElementById('companyOwedSypInput').value) || 0;
      state.companyOwedUsd = valUsd;
      state.companyOwedSyp = valSyp;
      saveState();
      if (showNotification) showToast('تم حفظ مبلغ (لنا من الشركة) ✓');
    }

    document.getElementById('companyOwedUsdInput').addEventListener('input', () => handleCompanyOwedChange(false));
    document.getElementById('companyOwedSypInput').addEventListener('input', () => handleCompanyOwedChange(false));
    document.getElementById('saveCompanyOwedBtn').addEventListener('click', () => handleCompanyOwedChange(true));

    function renderAccountSelects() {
      const activeAccs = getActiveAccounts();
      const opSel = document.getElementById('opAccount');
      const fromSel = document.getElementById('fromAccount');
      const toSel = document.getElementById('toAccount');

      const prevOp = opSel.value;
      const prevFrom = fromSel.value;
      const prevTo = toSel.value;

      opSel.innerHTML = '';
      fromSel.innerHTML = '';
      toSel.innerHTML = '';

      activeAccs.forEach(acc => {
        const label = `${acc.name} (${formatUsd(acc.usd)} | ${formatSyp(acc.syp)})`;
        const o1 = document.createElement('option'); o1.value = acc.id; o1.textContent = label; opSel.appendChild(o1);
        const o2 = document.createElement('option'); o2.value = acc.id; o2.textContent = label; fromSel.appendChild(o2);
        const o3 = document.createElement('option'); o3.value = acc.id; o3.textContent = label; toSel.appendChild(o3);
      });

      if (prevOp && activeAccs.some(a => a.id === prevOp)) opSel.value = prevOp;
      if (prevFrom && activeAccs.some(a => a.id === prevFrom)) fromSel.value = prevFrom;
      if (prevTo && activeAccs.some(a => a.id === prevTo)) {
        toSel.value = prevTo;
      } else if (activeAccs.length > 1) {
        toSel.value = activeAccs[1].id;
      }
    }

    function renderHistory() {
      const tabsContainer = document.getElementById('accountTabsContainer');
      const container = document.getElementById('accountsHistoryContainer');
      tabsContainer.innerHTML = '';
      container.innerHTML = '';

      const activeAccs = getActiveAccounts();
      const allHistory = state.history || [];

      if (!selectedHistoryAccId || (selectedHistoryAccId !== 'ALL' && !activeAccs.some(a => a.id === selectedHistoryAccId))) {
        selectedHistoryAccId = 'ALL';
      }

      const isAllSelected = selectedHistoryAccId === 'ALL';
      const allBtn = document.createElement('button');
      allBtn.type = 'button';
      allBtn.setAttribute('data-tab-acc-id', 'ALL');
      allBtn.className = isAllSelected
        ? 'px-3 py-1.5 rounded-xl text-xs font-extrabold bg-emerald-600 text-white shadow flex items-center gap-1.5 whitespace-nowrap transition'
        : 'px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-950 text-slate-400 hover:text-white border border-slate-800 flex items-center gap-1.5 whitespace-nowrap transition';
      allBtn.innerHTML = `
        <span>🌐 كل العمليات</span>
        <span class="text-[10px] px-1.5 py-0.5 rounded-full ${isAllSelected ? 'bg-emerald-700 text-emerald-100' : 'bg-slate-900 text-slate-400'}">${allHistory.length}</span>
      `;
      tabsContainer.appendChild(allBtn);

      activeAccs.forEach(acc => {
        const accCount = allHistory.filter(h => doesItemBelongToAccount(h, acc)).length;
        const isSelected = acc.id === selectedHistoryAccId;
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('data-tab-acc-id', acc.id);
        btn.className = isSelected
          ? 'px-3 py-1.5 rounded-xl text-xs font-extrabold bg-sky-600 text-white shadow flex items-center gap-1.5 whitespace-nowrap transition'
          : 'px-3 py-1.5 rounded-xl text-xs font-bold bg-slate-950 text-slate-400 hover:text-white border border-slate-800 flex items-center gap-1.5 whitespace-nowrap transition';

        btn.innerHTML = `
          <span>📁 ${escapeHtml(acc.name)}</span>
          <span class="text-[10px] px-1.5 py-0.5 rounded-full ${isSelected ? 'bg-sky-700 text-sky-100' : 'bg-slate-900 text-slate-400'}">${accCount}</span>
        `;
        tabsContainer.appendChild(btn);
      });

      const currentAcc = selectedHistoryAccId === 'ALL' ? null : activeAccs.find(a => a.id === selectedHistoryAccId);
      const q = searchQuery.trim().toLowerCase();

      const accItems = allHistory.filter(h => {
        const belongs = selectedHistoryAccId === 'ALL' ? true : doesItemBelongToAccount(h, currentAcc);
        if (!belongs) return false;
        if (!q) return true;

        const opNumMatch = String(h.opNumber || h.note || '').toLowerCase().includes(q);
        const amountMatch = String(h.amount || '').toLowerCase().includes(q);
        return opNumMatch || amountMatch;
      });

      if (accItems.length === 0) {
        container.innerHTML = `<div class="bg-slate-950/70 border border-slate-800 rounded-xl p-4 text-[11px] text-slate-400 text-center">
          ${q ? 'لا توجد عمليات مطابقة لبحثك' : 'لا توجد حركات مسجلة في هذا القسم بعد'}
        </div>`;
        return;
      }

      const daysMap = {};
      accItems.forEach(h => {
        const dateStr = h.date || new Date().toLocaleDateString('en-CA');
        if (!daysMap[dateStr]) daysMap[dateStr] = [];
        daysMap[dateStr].push(h);
      });

      const sortedDays = Object.keys(daysMap).sort().reverse();

      sortedDays.forEach(day => {
        const dayItems = daysMap[day];
        const dayBox = document.createElement('div');
        dayBox.className = 'bg-slate-950/80 border border-slate-800 rounded-xl p-3 space-y-2';

        let dayHtml = `
          <div class="flex items-center justify-between text-[11px] text-sky-400 font-bold border-b border-slate-800 pb-1.5">
            <span>📅 تاريخ اليوم: ${day}</span>
            <span class="text-[10px] bg-slate-900 px-2 py-0.5 rounded text-slate-400">${dayItems.length} حركات</span>
          </div>
          <div class="space-y-1.5">
        `;

        dayItems.forEach(h => {
          const amountStr = h.currency === 'USD' ? formatUsd(h.amount) : formatSyp(h.amount);
          let badge = '', desc = '';
          const targetAccName = escapeHtml(h.accountName || '');

          if (h.type === 'deposit') {
            badge = `<span class="text-emerald-400 font-bold">➕ إيداع</span>`;
            desc = h.excludeFromTotal ? `مستثنى من الإجمالي` : (selectedHistoryAccId === 'ALL' ? `إلى ${targetAccName}` : `إيداع`);
          } else if (h.type === 'withdraw') {
            badge = `<span class="text-rose-400 font-bold">➖ سحب</span>`;
            desc = h.excludeFromTotal ? `مستثنى من الإجمالي` : (selectedHistoryAccId === 'ALL' ? `من ${targetAccName}` : `سحب`);
          } else {
            if (currentAcc && (h.fromId === currentAcc.id || h.fromName === currentAcc.name)) {
              badge = `<span class="text-sky-400 font-bold">🔄 نقل صادر</span>`;
              desc = `إلى ${escapeHtml(h.toName)}`;
            } else if (currentAcc) {
              badge = `<span class="text-emerald-400 font-bold">🔄 نقل وارد</span>`;
              desc = `من ${escapeHtml(h.fromName)}`;
            } else {
              badge = `<span class="text-sky-400 font-bold">🔄 نقل</span>`;
              desc = `من ${escapeHtml(h.fromName)} إلى ${escapeHtml(h.toName)}`;
            }
          }

          const refValue = h.opNumber || h.note || '';
          const opNumHtml = refValue ? `<span class="text-sky-300 font-semibold bg-sky-500/10 px-2 py-0.5 rounded text-[10px] num-font">🔢 #${escapeHtml(refValue)}</span>` : '';

          dayHtml += `
            <div class="bg-slate-900 border border-slate-800/70 rounded-lg px-2.5 py-2 flex items-center justify-between text-xs gap-2">
              <div class="flex items-center gap-2 flex-wrap">
                ${badge}
                <span class="font-extrabold text-white num-font">${amountStr}</span>
                <span class="text-slate-400 text-[11px]">(${desc})</span>
                ${opNumHtml}
              </div>
              <button type="button" data-undo-id="${h.id}" class="text-[10px] text-rose-400 hover:underline font-semibold whitespace-nowrap">تراجع</button>
            </div>
          `;
        });

        dayHtml += `</div>`;
        dayBox.innerHTML = dayHtml;
        container.appendChild(dayBox);
      });
    }

    document.getElementById('accountTabsContainer').addEventListener('click', e => {
      const btn = e.target.closest('button[data-tab-acc-id]');
      if (!btn) return;
      selectedHistoryAccId = btn.getAttribute('data-tab-acc-id');
      renderHistory();
    });

    document.getElementById('historySearchInput').addEventListener('input', e => {
      searchQuery = e.target.value;
      renderHistory();
    });

    function setMode(mode) {
      currentMode = mode;
      const depBtn = document.getElementById('modeDepositBtn');
      const wdBtn = document.getElementById('modeWithdrawBtn');
      const trBtn = document.getElementById('modeTransferBtn');
      const singleBox = document.getElementById('singleAccountBox');
      const transferBox = document.getElementById('transferAccountsBox');
      const singleLabel = document.getElementById('singleAccountLabel');
      const submitBtn = document.getElementById('submitOpBtn');
      const excludeBox = document.getElementById('excludeFromTotalBox');

      const baseClass = 'py-2 px-1 rounded-xl text-xs font-bold transition text-slate-400 hover:text-white hover:bg-slate-800';
      depBtn.className = baseClass; wdBtn.className = baseClass; trBtn.className = baseClass;

      if (mode === 'deposit') {
        depBtn.className = 'py-2 px-1 rounded-xl text-xs font-bold transition bg-emerald-600 text-white shadow';
        singleBox.classList.remove('hidden'); transferBox.classList.add('hidden');
        excludeBox.classList.remove('hidden');
        singleLabel.textContent = 'إيداع في حساب';
        submitBtn.textContent = 'تأكيد الإيداع وتحديث الرصيد';
        submitBtn.className = 'w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow-md transition';
      } else if (mode === 'withdraw') {
        wdBtn.className = 'py-2 px-1 rounded-xl text-xs font-bold transition bg-rose-600 text-white shadow';
        singleBox.classList.remove('hidden'); transferBox.classList.add('hidden');
        excludeBox.classList.remove('hidden');
        singleLabel.textContent = 'سحب من حساب';
        submitBtn.textContent = 'تأكيد السحب وتحديث الرصيد';
        submitBtn.className = 'w-full py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white font-bold text-xs shadow-md transition';
      } else {
        trBtn.className = 'py-2 px-1 rounded-xl text-xs font-bold transition bg-sky-600 text-white shadow';
        singleBox.classList.add('hidden'); transferBox.classList.remove('hidden');
        excludeBox.classList.add('hidden');
        submitBtn.textContent = 'تأكيد النقل بين الحسابين';
        submitBtn.className = 'w-full py-2.5 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs shadow-md transition';
      }
    }

    document.getElementById('modeDepositBtn').addEventListener('click', () => setMode('deposit'));
    document.getElementById('modeWithdrawBtn').addEventListener('click', () => setMode('withdraw'));
    document.getElementById('modeTransferBtn').addEventListener('click', () => setMode('transfer'));

    // تعيين التاريخ الافتراضي لليوم الحالي في خانة الإدخال والتصدير
    const todayStr = new Date().toLocaleDateString('en-CA');
    document.getElementById('opDate').value = todayStr;
    document.getElementById('exportDateInput').value = todayStr;

    document.getElementById('operationForm').addEventListener('submit', e => {
      e.preventDefault();
      const amount = parseFloat(document.getElementById('opAmount').value);
      const currency = document.getElementById('opCurrency').value;
      const opDate = document.getElementById('opDate').value || todayStr;
      const opNumber = document.getElementById('opOpNumber').value.trim().replace(/^#+/, '');
      const excludeFromTotal = document.getElementById('excludeFromTotalCheckbox').checked;
      if (!amount || amount <= 0) return;

      const nowTimestamp = new Date(opDate + 'T12:00:00').getTime() || Date.now();

      if (currentMode === 'deposit' || currentMode === 'withdraw') {
        const accId = document.getElementById('opAccount').value;
        const acc = state.accounts.find(a => a.id === accId);
        if (!acc) return;

        const delta = currentMode === 'deposit' ? amount : -amount;
        if (currency === 'USD') {
          acc.usd = Number((Number(acc.usd || 0) + delta).toFixed(2));
        } else {
          acc.syp = Math.round(Number(acc.syp || 0) + delta);
        }

        state.history.unshift({
          id: 'h_' + nowTimestamp + '_' + Math.floor(Math.random()*1000),
          date: opDate,
          type: currentMode,
          excludeFromTotal,
          amount,
          currency,
          opNumber,
          accountId: acc.id,
          accountName: acc.name
        });
        selectedHistoryAccId = acc.id;
        showToast(currentMode === 'deposit' ? 'تمت إضافة المبلغ لتاريخ ' + opDate : 'تم خصم المبلغ لتاريخ ' + opDate);
      } else if (currentMode === 'transfer') {
        const fromId = document.getElementById('fromAccount').value;
        const toId = document.getElementById('toAccount').value;
        if (!fromId || !toId || fromId === toId) {
          showToast('يرجى اختيار حسابين مختلفين للنقل بينهما');
          return;
        }

        const fromAcc = state.accounts.find(a => a.id === fromId);
        const toAcc = state.accounts.find(a => a.id === toId);
        if (!fromAcc || !toAcc) return;

        if (currency === 'USD') {
          fromAcc.usd = Number((Number(fromAcc.usd || 0) - amount).toFixed(2));
          toAcc.usd = Number((Number(toAcc.usd || 0) + amount).toFixed(2));
        } else {
          fromAcc.syp = Math.round(Number(fromAcc.syp || 0) - amount);
          toAcc.syp = Math.round(Number(toAcc.syp || 0) + amount);
        }

        state.history.unshift({
          id: 'h_' + nowTimestamp + '_' + Math.floor(Math.random()*1000),
          date: opDate,
          type: 'transfer',
          amount,
          currency,
          opNumber,
          fromId: fromAcc.id,
          fromName: fromAcc.name,
          toId: toAcc.id,
          toName: toAcc.name
        });
        selectedHistoryAccId = fromAcc.id;
        showToast(`تم نقل المبلغ بتاريخ ${opDate}`);
      }

      saveState();
      renderAll();
      document.getElementById('opAmount').value = '';
      document.getElementById('opOpNumber').value = '';
      document.getElementById('excludeFromTotalCheckbox').checked = false;
      document.getElementById('opCurrency').value = 'USD';
      document.getElementById('opDate').value = todayStr;
    });

    document.getElementById('accountsHistoryContainer').addEventListener('click', e => {
      const btn = e.target.closest('button[data-undo-id]');
      if (!btn) return;
      const id = btn.getAttribute('data-undo-id');
      const item = state.history.find(h => h.id === id);
      if (!item) return;

      if (item.type === 'deposit' || item.type === 'withdraw') {
        const acc = state.accounts.find(a => a.id === item.accountId || a.name === item.accountName);
        if (acc) {
          const reverseDelta = item.type === 'deposit' ? -item.amount : item.amount;
          if (item.currency === 'USD') acc.usd = Number((Number(acc.usd || 0) + reverseDelta).toFixed(2));
          else acc.syp = Math.round(Number(acc.syp || 0) + reverseDelta);
        }
      } else if (item.type === 'transfer') {
        const fromAcc = state.accounts.find(a => a.id === item.fromId || a.name === item.fromName);
        const toAcc = state.accounts.find(a => a.id === item.toId || a.name === item.toName);
        if (fromAcc) {
          if (item.currency === 'USD') fromAcc.usd = Number((Number(fromAcc.usd || 0) + item.amount).toFixed(2));
          else fromAcc.syp = Math.round(Number(fromAcc.syp || 0) + item.amount);
        }
        if (toAcc) {
          if (item.currency === 'USD') toAcc.usd = Number((Number(toAcc.usd || 0) - item.amount).toFixed(2));
          else toAcc.syp = Math.round(Number(toAcc.syp || 0) - item.amount);
        }
      }

      state.history = state.history.filter(h => h.id !== id);
      saveState(); renderAll();
      showToast('تم التراجع عن العملية');
    });

    document.getElementById('clearHistoryBtn').addEventListener('click', () => {
      if (!confirm('هل أنت متأكد من مسح سجل العمليات بالكامل؟')) return;
      state.history = [];
      saveState(); renderHistory();
      showToast('تم مسح السجل');
    });

    // تصدير تقرير اليوم المختار
    document.getElementById('exportReportBtn').addEventListener('click', () => {
      const selectedDate = document.getElementById('exportDateInput').value;
      if (!selectedDate) {
        showToast('الرجاء اختيار التاريخ أولاً من خانة التاريخ بجانب الزر');
        return;
      }

      const allHistory = state.history || [];
      const dayOps = allHistory.filter(h => {
        if (h.excludeFromTotal) return false;
        const dateStr = h.date || new Date().toLocaleDateString('en-CA');
        return dateStr === selectedDate;
      });

      if (dayOps.length === 0) {
        showToast(`لا توجد عمليات مسجلة في تاريخ ${selectedDate}`);
        return;
      }

      let dayDepUsd = 0, dayDepSyp = 0, dayWdUsd = 0, dayWdSyp = 0;
      dayOps.forEach(op => {
        const amt = Number(op.amount) || 0;
        if (op.type === 'deposit') {
          if (op.currency === 'USD') dayDepUsd += amt; else dayDepSyp += amt;
        } else if (op.type === 'withdraw') {
          if (op.currency === 'USD') dayWdUsd += amt; else dayWdSyp += amt;
        }
      });

      let reportText = "====================================\n";
      reportText += `      تقرير يوم: ${selectedDate}      \n`;
      reportText += "====================================\n\n";

      reportText += `• مجموع إيداعات هذا اليوم: USD ${dayDepUsd} | SYP ${dayDepSyp}\n`;
      reportText += `• مجموع سحوبات هذا اليوم: USD ${dayWdUsd} | SYP ${dayWdSyp}\n`;
      reportText += `• إجمالي عدد الحركات في هذا اليوم: ${dayOps.length} عملية\n\n`;

      reportText += "--- تفصيل العمليات والحسابات ---\n";
      dayOps.forEach((h, idx) => {
        const refVal = h.opNumber || h.note || '';
        const opNumStr = refVal ? ` [رقم العملية: #${refVal}]` : '';
        const accName = h.accountName || (h.fromName ? `${h.fromName} إلى ${h.toName}` : 'حساب عام');

        if (h.type === 'deposit') {
          reportText += `${idx + 1}. [إيداع] - الحساب: (${accName}) - المبلغ: ${h.amount} ${h.currency}${opNumStr}\n`;
        } else if (h.type === 'withdraw') {
          reportText += `${idx + 1}. [سحب] - الحساب: (${accName}) - المبلغ: ${h.amount} ${h.currency}${opNumStr}\n`;
        } else if (h.type === 'transfer') {
          reportText += `${idx + 1}. [نقل] - من (${h.fromName}) إلى (${h.toName}) - المبلغ: ${h.amount} ${h.currency}${opNumStr}\n`;
        }
      });

      const blob = new Blob([reportText], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `ShamCash_Report_${selectedDate}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);

      showToast(`تم تصدير تقرير يوم ${selectedDate} بنجاح ✓`);
    });

    renderAll();
    pullStateFromCloud();
  </script>
</body>
</html>
