<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إعدادات الحسابات والقاعدة</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'Inter', 'sans-serif'],
            mono: ['Inter', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .num-font {
      font-family: 'Inter', 'Cairo', sans-serif;
      direction: ltr;
      display: inline-block;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 py-6 px-4">

  <div class="max-w-2xl mx-auto space-y-5">

    <!-- شريط العنوان وزر العودة للرئيسية -->
    <div class="flex items-center justify-between">
      <h1 class="text-lg font-extrabold text-white">⚙️ لوحة الإعدادات وإدارة الحسابات</h1>
      <a href="index.html" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold text-slate-200 flex items-center gap-2 transition">
        <span>⬅️</span>
        <span>العودة للرئيسية</span>
      </a>
    </div>

    <!-- قسم الإعدادات (إدارة الحسابات) -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4 shadow-lg">
      <div class="border-b border-slate-800 pb-3">
        <h2 class="text-sm font-bold text-white">إدارة الحسابات وتعديل الأرصدة</h2>
        <p class="text-[11px] text-slate-400">سمِّ حساباتك، فعّل أو أوقف أي حساب، أو عدّل الرصيد يدوياً</p>
      </div>

      <div id="settingsAccountsList" class="space-y-2.5"></div>

      <!-- ربط قاعدة البيانات السحابية -->
      <div class="pt-4 border-t border-slate-800 space-y-3">
        <div class="flex items-center justify-between">
          <div>
            <h3 class="text-xs font-bold text-sky-400">☁️ ربط قاعدة بيانات سحابية (Firebase)</h3>
            <p class="text-[11px] text-slate-400">ضع رابط قاعدة البيانات ليتم حفظ ومزامنة الرصيد تلقائياً</p>
          </div>
          <span id="dbSyncStatus" class="text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-400">غير مربوط</span>
        </div>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
          <div class="sm:col-span-2">
            <label for="dbUrlInput" class="block text-[11px] text-slate-400 mb-1">رابط قاعدة البيانات (Firebase URL)</label>
            <input id="dbUrlInput" type="url" placeholder="https://your-project-default-rtdb.firebaseio.com" class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-xs text-white num-font" />
          </div>
          <div>
            <label for="dbSecretKeyInput" class="block text-[11px] text-slate-400 mb-1">معرّف خاص بك (رمز سري)</label>
            <input id="dbSecretKeyInput" type="text" placeholder="مثال: sokrat_wallet" class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-xs text-white num-font" />
          </div>
        </div>
        <div class="flex flex-wrap items-center gap-2">
          <button id="saveDbConfigBtn" type="button" class="px-4 py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-xs font-bold text-white transition">
            حفظ وربط قاعدة البيانات
          </button>
          <button id="pullFromDbBtn" type="button" class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-700 text-xs font-bold text-slate-200 border border-slate-700 transition">
            🔄 جلب الأرصدة من القاعدة الآن
          </button>
        </div>
      </div>

      <!-- نموذج إضافة حساب جديد -->
      <form id="addAccountForm" class="pt-4 border-t border-slate-800 space-y-3">
        <h3 class="text-xs font-bold text-emerald-400">+ إضافة حساب جديد</h3>
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
          <div>
            <label for="newAccName" class="block text-[11px] text-slate-400 mb-1">اسم الحساب</label>
            <input id="newAccName" type="text" required placeholder="مثال: حساب 3" class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-xs text-white" />
          </div>
          <div>
            <label for="newAccUsd" class="block text-[11px] text-slate-400 mb-1">رصيد الدولار ($)</label>
            <input id="newAccUsd" type="number" step="any" value="0" class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-xs font-bold text-emerald-400 num-font" />
          </div>
          <div>
            <label for="newAccSyp" class="block text-[11px] text-slate-400 mb-1">رصيد السوري (ل.س)</label>
            <input id="newAccSyp" type="number" step="any" value="0" class="w-full rounded-xl bg-slate-950 border border-slate-700 px-3 py-2 text-xs font-bold text-amber-400 num-font" />
          </div>
        </div>
        <button type="submit" class="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white transition">
          إضافة وتفعيل الحساب
        </button>
      </form>
    </section>

  </div>

  <div id="toastBox" class="fixed bottom-4 left-4 z-50 hidden px-4 py-2.5 rounded-xl bg-slate-800 border border-emerald-500/40 text-white text-xs font-bold shadow-xl">
    <span id="toastText">تم التحديث</span>
  </div>

  <script>
    const STORAGE_KEY = 'simple_balance_mediator_v2';
    const DB_CONFIG_KEY = 'simple_balance_db_config_v1';

    const defaultState = {
      accounts: [
        { id: 'acc_1', name: 'حساب 1', usd: 1500, syp: 10000000, active: true },
        { id: 'acc_2', name: 'حساب 2', usd: 500, syp: 5000000, active: true }
      ],
      history: []
    };

    let state = loadState();
    let dbConfig = loadDbConfig();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.accounts)) return parsed;
        }
      } catch (e) {}
      return JSON.parse(JSON.stringify(defaultState));
    }

    function loadDbConfig() {
      try {
        const raw = localStorage.getItem(DB_CONFIG_KEY);
        if (raw) return JSON.parse(raw);
      } catch (e) {}
      return { dbUrl: '', secretKey: 'my_balances' };
    }

    function getCloudEndpoint() {
      if (!dbConfig || !dbConfig.dbUrl) return null;
      const base = dbConfig.dbUrl.trim().replace(/\/+$/, '');
      const key = encodeURIComponent((dbConfig.secretKey || 'my_balances').trim());
      return `${base}/shamcash_${key}.json`;
    }

    function updateDbStatusBadge(text, isConnected) {
      const badge = document.getElementById('dbSyncStatus');
      if (!badge) return;
      badge.textContent = text;
      badge.className = isConnected
        ? 'text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-emerald-500/15 text-emerald-400 border border-emerald-500/30'
        : 'text-[11px] font-bold px-2.5 py-0.5 rounded-full bg-slate-800 text-slate-400';
    }

    async function pushStateToCloud() {
      const endpoint = getCloudEndpoint();
      if (!endpoint) return;
      try {
        updateDbStatusBadge('جاري المزامنة...', true);
        const res = await fetch(endpoint, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            accounts: state.accounts,
            history: state.history,
            updatedAt: Date.now()
          })
        });
        if (res.ok) updateDbStatusBadge('متصل ومتزامن سحابياً ✓', true);
        else updateDbStatusBadge('خطأ في الاتصال', false);
      } catch (e) {
        updateDbStatusBadge('تعذر الاتصال', false);
      }
    }

    async function pullStateFromCloud(silent) {
      const endpoint = getCloudEndpoint();
      if (!endpoint) {
        if (!silent) showToast('أدخل رابط قاعدة البيانات أولاً');
        return;
      }
      try {
        updateDbStatusBadge('جاري الجلب...', true);
        const res = await fetch(endpoint);
        if (res.ok) {
          const data = await res.json();
          if (data && Array.isArray(data.accounts)) {
            state.accounts = data.accounts;
            state.history = Array.isArray(data.history) ? data.history : [];
            try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
            updateDbStatusBadge('متصل ومتزامن سحابياً ✓', true);
            renderSettingsAccounts();
            if (!silent) showToast('تم جلب الأرصدة من القاعدة');
          } else {
            await pushStateToCloud();
            if (!silent) showToast('تم رفع الحسابات للقاعدة');
          }
        } else {
          updateDbStatusBadge('تأكد من الرابط أو Test Mode', false);
        }
      } catch (e) {
        updateDbStatusBadge('تعذر الاتصال', false);
      }
    }

    function saveState() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      pushStateToCloud();
    }

    function showToast(msg) {
      const box = document.getElementById('toastBox');
      document.getElementById('toastText').textContent = msg;
      box.classList.remove('hidden');
      if (window._toastTimer) clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => box.classList.add('hidden'), 2500);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderSettingsAccounts() {
      const container = document.getElementById('settingsAccountsList');
      container.innerHTML = '';

      state.accounts.forEach((acc, idx) => {
        const item = document.createElement('div');
        item.className = 'bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-2.5';
        item.innerHTML = `
          <div class="grid grid-cols-1 sm:grid-cols-12 gap-2 items-center">
            <div class="sm:col-span-4">
              <label class="block text-[10px] text-slate-400 mb-0.5">اسم الحساب #${idx + 1}</label>
              <input type="text" data-field="name" data-id="${acc.id}" value="${escapeHtml(acc.name)}" class="w-full rounded-lg bg-slate-900 border border-slate-700 px-2.5 py-1.5 text-xs font-bold text-white" />
            </div>
            <div class="sm:col-span-3">
              <label class="block text-[10px] text-slate-400 mb-0.5">رصيد الدولار ($)</label>
              <input type="number" step="any" data-field="usd" data-id="${acc.id}" value="${acc.usd}" class="w-full rounded-lg bg-slate-900 border border-slate-700 px-2.5 py-1.5 text-xs font-bold text-emerald-400 num-font" />
            </div>
            <div class="sm:col-span-3">
              <label class="block text-[10px] text-slate-400 mb-0.5">رصيد السوري (ل.س)</label>
              <input type="number" step="any" data-field="syp" data-id="${acc.id}" value="${acc.syp}" class="w-full rounded-lg bg-slate-900 border border-slate-700 px-2.5 py-1.5 text-xs font-bold text-amber-400 num-font" />
            </div>
            <div class="sm:col-span-2 flex items-center justify-end gap-1.5 pt-3 sm:pt-4">
              <button type="button" data-acc-action="toggle" data-id="${acc.id}" class="px-2.5 py-1.5 rounded-lg text-[11px] font-bold transition ${acc.active ? 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/30' : 'bg-slate-800 text-slate-400 border border-slate-700'}">
                ${acc.active ? 'مفعّل ✓' : 'موقوف'}
              </button>
              ${state.accounts.length > 1 ? `<button type="button" data-acc-action="delete" data-id="${acc.id}" class="px-2 py-1.5 rounded-lg bg-slate-900 hover:bg-rose-950 text-rose-400 text-xs transition" title="حذف">🗑️</button>` : ''}
            </div>
          </div>
        `;
        container.appendChild(item);
      });
    }

    document.getElementById('settingsAccountsList').addEventListener('change', e => {
      const input = e.target.closest('input[data-field]');
      if (!input) return;
      const id = input.getAttribute('data-id');
      const field = input.getAttribute('data-field');
      const acc = state.accounts.find(a => a.id === id);
      if (!acc) return;

      if (field === 'name') {
        const val = input.value.trim();
        if (val) acc.name = val;
      } else if (field === 'usd') {
        acc.usd = parseFloat(input.value) || 0;
      } else if (field === 'syp') {
        acc.syp = parseFloat(input.value) || 0;
      }

      saveState();
      renderSettingsAccounts();
      showToast('تم حفظ تعديل الحساب');
    });

    document.getElementById('settingsAccountsList').addEventListener('click', e => {
      const btn = e.target.closest('button[data-acc-action]');
      if (!btn) return;
      const action = btn.getAttribute('data-acc-action');
      const id = btn.getAttribute('data-id');
      const acc = state.accounts.find(a => a.id === id);
      if (!acc) return;

      if (action === 'toggle') {
        acc.active = !acc.active;
        saveState(); renderSettingsAccounts();
        showToast(acc.active ? `تم تفعيل ${acc.name}` : `تم إيقاف ${acc.name}`);
      } else if (action === 'delete') {
        if (state.accounts.length <= 1) return;
        state.accounts = state.accounts.filter(a => a.id !== id);
        saveState(); renderSettingsAccounts();
        showToast('تم حذف الحساب');
      }
    });

    document.getElementById('addAccountForm').addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('newAccName').value.trim();
      const usd = parseFloat(document.getElementById('newAccUsd').value) || 0;
      const syp = parseFloat(document.getElementById('newAccSyp').value) || 0;
      if (!name) return;

      state.accounts.push({ id: 'acc_' + Date.now(), name, usd, syp, active: true });
      saveState(); renderSettingsAccounts();
      document.getElementById('newAccName').value = '';
      document.getElementById('newAccUsd').value = '0';
      document.getElementById('newAccSyp').value = '0';
      showToast('تمت إضافة الحساب وتفعيله');
    });

    document.getElementById('saveDbConfigBtn').addEventListener('click', () => {
      const urlVal = document.getElementById('dbUrlInput').value.trim();
      const keyVal = document.getElementById('dbSecretKeyInput').value.trim() || 'my_balances';
      dbConfig = { dbUrl: urlVal, secretKey: keyVal };
      try { localStorage.setItem(DB_CONFIG_KEY, JSON.stringify(dbConfig)); } catch (e) {}
      if (urlVal) {
        pullStateFromCloud(false);
      } else {
        updateDbStatusBadge('غير مربوط', false);
        showToast('تم إيقاف الربط السحابي');
      }
    });

    document.getElementById('pullFromDbBtn').addEventListener('click', () => {
      pullStateFromCloud(false);
    });

    // تهيئة البيانات
    document.getElementById('dbUrlInput').value = dbConfig.dbUrl || '';
    document.getElementById('dbSecretKeyInput').value = dbConfig.secretKey || 'my_balances';
    if (dbConfig.dbUrl) {
      updateDbStatusBadge('متصل سحابياً ✓', true);
    }
    renderSettingsAccounts();
  </script>
</body>
</html>
