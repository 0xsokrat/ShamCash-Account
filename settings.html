<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>إعدادات الحسابات والمزامنة ($)</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Cairo', 'Inter', 'sans-serif'],
            mono: ['Inter', 'monospace']
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Cairo', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
    }
    .num-font {
      font-family: 'Inter', 'Cairo', sans-serif;
      direction: ltr;
      display: inline-block;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 py-5 px-3">

  <div class="max-w-xl mx-auto space-y-4">

    <!-- شريط العنوان والعودة -->
    <div class="flex items-center justify-between gap-2 flex-wrap">
      <div class="flex items-center gap-2">
        <h1 class="text-base font-extrabold text-white">⚙️ إعدادات الحسابات والمزامنة</h1>
        <span id="syncStatusBadge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700">⏳ جاري الاتصال...</span>
      </div>
      <a href="index.html" class="px-3 py-1.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-xs font-bold text-white flex items-center gap-1.5 shadow transition">
        <span>⬅️</span>
        <span>العودة للوحة الرئيسية</span>
      </a>
    </div>

    <!-- 1. إضافة حساب جديد -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg space-y-3">
      <h2 class="text-xs font-extrabold text-emerald-400">➕ إضافة حساب جديد ($)</h2>
      <form id="addAccountForm" class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
        <div class="sm:col-span-2">
          <label for="newAccName" class="block text-[11px] font-bold text-slate-300 mb-1">اسم الحساب</label>
          <input id="newAccName" type="text" required placeholder="مثال: شام كاش، سيريتل كاش، كاش..." class="w-full rounded-xl bg-slate-950 border border-slate-700 focus:border-emerald-500 focus:outline-none px-3 py-2 text-xs text-white" />
        </div>
        <div>
          <label for="newAccUsd" class="block text-[11px] font-bold text-slate-300 mb-1">الرصيد الابتدائي ($)</label>
          <input id="newAccUsd" type="number" step="any" placeholder="0" class="w-full rounded-xl bg-slate-950 border border-slate-700 focus:border-emerald-500 focus:outline-none px-3 py-2 text-xs font-extrabold text-emerald-400 num-font" />
        </div>
        <button type="submit" class="sm:col-span-3 w-full py-2.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs shadow transition">
          إضافة الحساب وحفظه في السحابة ✓
        </button>
      </form>
    </section>

    <!-- 2. قائمة الحسابات الحالية -->
    <section class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg space-y-3">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <h2 class="text-xs font-extrabold text-sky-400">📁 إدارة الحسابات الحالية</h2>
        <span id="accountsCountBadge" class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-slate-800 text-slate-300">0 حسابات</span>
      </div>
      <div id="accountsListContainer" class="space-y-2.5"></div>
    </section>

    <!-- 3. إعدادات المزامنة السحابية (Firebase) -->
    <section class="bg-slate-900 border border-sky-500/30 rounded-2xl p-4 shadow-lg space-y-3">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2">
        <h2 class="text-xs font-extrabold text-sky-400">☁️ المزامنة السحابية (Firebase)</h2>
        <span class="text-[10px] font-bold text-emerald-400">مثبت تلقائياً ✓</span>
      </div>

      <form id="cloudConfigForm" class="space-y-2.5">
        <div>
          <label for="dbUrlInput" class="block text-[11px] font-bold text-slate-300 mb-1">رابط قاعدة البيانات (Firebase URL)</label>
          <input id="dbUrlInput" type="url" required class="w-full rounded-xl bg-slate-950 border border-slate-700 focus:border-sky-500 focus:outline-none px-3 py-2 text-xs text-sky-300 num-font" />
        </div>
        <div>
          <label for="secretKeyInput" class="block text-[11px] font-bold text-slate-300 mb-1">المفتاح السري (Secret Key)</label>
          <input id="secretKeyInput" type="text" required class="w-full rounded-xl bg-slate-950 border border-slate-700 focus:border-sky-500 focus:outline-none px-3 py-2 text-xs text-white num-font" />
        </div>

        <div class="grid grid-cols-3 gap-2 pt-1">
          <button type="submit" class="py-2 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-[11px] shadow transition">
            حفظ الإعدادات
          </button>
          <button id="forcePullBtn" type="button" class="py-2 rounded-xl bg-emerald-600/20 hover:bg-emerald-600/30 border border-emerald-500/40 text-emerald-300 font-bold text-[11px] transition">
            ⬇️ سحب من السحابة
          </button>
          <button id="forcePushBtn" type="button" class="py-2 rounded-xl bg-amber-600/20 hover:bg-amber-600/30 border border-amber-500/40 text-amber-300 font-bold text-[11px] transition">
            ⬆️ رفع للسحابة
          </button>
        </div>
      </form>
    </section>

  </div>

  <div id="toastBox" class="fixed bottom-4 left-4 z-50 hidden px-3 py-2 rounded-xl bg-slate-800 border border-emerald-500/40 text-white text-xs font-bold shadow-xl">
    <span id="toastText">تم التحديث</span>
  </div>

  <script>
    const HARDCODED_FIREBASE_URL = 'https://shamcashapp-46c89-default-rtdb.firebaseio.com';
    const HARDCODED_SECRET_KEY   = 'my_balances';

    const STORAGE_KEY = 'simple_balance_mediator_v2';
    const DB_CONFIG_KEY = 'simple_balance_db_config_v1';

    const defaultState = {
      accounts: [
        { id: 'acc_1', name: 'حساب 1', usd: 0, active: true },
        { id: 'acc_2', name: 'حساب 2', usd: 0, active: true }
      ],
      history: [],
      deletedIds: [],
      initialDepositUsd: 0,
      initialWithdrawUsd: 0,
      initialExpenseUsd: 0,
      updatedAt: 0
    };

    let state = loadState();
    let dbConfig = loadDbConfig();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && Array.isArray(parsed.accounts)) {
            parsed.history = Array.isArray(parsed.history) ? parsed.history : [];
            parsed.deletedIds = Array.isArray(parsed.deletedIds) ? parsed.deletedIds : [];
            parsed.initialDepositUsd = Number(parsed.initialDepositUsd) || 0;
            parsed.initialWithdrawUsd = Number(parsed.initialWithdrawUsd) || 0;
            parsed.initialExpenseUsd = Number(parsed.initialExpenseUsd) || 0;
            parsed.updatedAt = Number(parsed.updatedAt) || 0;
            return parsed;
          }
        }
      } catch (e) {}
      return JSON.parse(JSON.stringify(defaultState));
    }

    function loadDbConfig() {
      try {
        const raw = localStorage.getItem(DB_CONFIG_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed && parsed.dbUrl) return parsed;
        }
      } catch (e) {}
      const cfg = { dbUrl: HARDCODED_FIREBASE_URL, secretKey: HARDCODED_SECRET_KEY };
      try { localStorage.setItem(DB_CONFIG_KEY, JSON.stringify(cfg)); } catch (e) {}
      return cfg;
    }

    function getCloudEndpoint() {
      const urlToUse = (dbConfig && dbConfig.dbUrl) ? dbConfig.dbUrl : HARDCODED_FIREBASE_URL;
      if (!urlToUse) return null;
      const base = urlToUse.trim().replace(/\/+$/, '');
      const key = encodeURIComponent(((dbConfig && dbConfig.secretKey) || HARDCODED_SECRET_KEY || 'my_balances').trim());
      return `${base}/shamcash_${key}.json`;
    }

    function setSyncBadge(status, text) {
      const badge = document.getElementById('syncStatusBadge');
      if (!badge) return;
      if (status === 'ok') {
        badge.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/30';
        badge.textContent = text || '☁️ متزامن';
      } else if (status === 'syncing') {
        badge.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-sky-500/10 text-sky-300 border border-sky-500/30';
        badge.textContent = text || '🔄 جاري المزامنة...';
      } else {
        badge.className = 'text-[10px] font-bold px-2 py-0.5 rounded-full bg-amber-500/10 text-amber-300 border border-amber-500/30';
        badge.textContent = text || '⚠️ غير متصل';
      }
    }

    function showToast(msg) {
      const box = document.getElementById('toastBox');
      document.getElementById('toastText').textContent = msg;
      box.classList.remove('hidden');
      if (window._toastTimer) clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => box.classList.add('hidden'), 2500);
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function pushStateToCloud(showNotification = false) {
      const endpoint = getCloudEndpoint();
      if (!endpoint) return;
      setSyncBadge('syncing');
      try {
        state.updatedAt = Date.now();
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
        const res = await fetch(endpoint, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(state)
        });
        if (res.ok) {
          setSyncBadge('ok', '☁️ متزامن تلقائياً');
          if (showNotification) showToast('تم رفع البيانات للسحابة بنجاح ✓');
        } else {
          setSyncBadge('warn', '⚠️ خطأ مزامنة');
        }
      } catch (e) {
        setSyncBadge('warn', '⚠️ لا يوجد إنترنت');
      }
    }

    async function pullStateFromCloud(showNotification = false) {
      const endpoint = getCloudEndpoint();
      if (!endpoint) return;
      setSyncBadge('syncing');
      try {
        const res = await fetch(endpoint, { cache: 'no-store' });
        if (!res.ok) {
          setSyncBadge('warn', '⚠️ تعذر الاتصال');
          return;
        }
        const data = await res.json();
        if (data && Array.isArray(data.accounts)) {
          state.accounts = data.accounts;
          state.history = Array.isArray(data.history) ? data.history : [];
          state.deletedIds = Array.isArray(data.deletedIds) ? data.deletedIds : [];
          state.initialDepositUsd = Number(data.initialDepositUsd) || 0;
          state.initialWithdrawUsd = Number(data.initialWithdrawUsd) || 0;
          state.initialExpenseUsd = Number(data.initialExpenseUsd) || 0;
          state.updatedAt = Number(data.updatedAt) || Date.now();
          try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
          renderAccounts();
        }
        setSyncBadge('ok', '☁️ متزامن تلقائياً');
        if (showNotification) showToast('تم سحب أحدث البيانات من السحابة ✓');
      } catch (e) {
        setSyncBadge('warn', '⚠️ تعذر الاتصال');
      }
    }

    function saveAndSync() {
      state.updatedAt = Date.now();
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
      pushStateToCloud(false);
    }

    function renderAccounts() {
      const container = document.getElementById('accountsListContainer');
      document.getElementById('accountsCountBadge').textContent = `${state.accounts.length} حسابات`;
      container.innerHTML = '';

      if (state.accounts.length === 0) {
        container.innerHTML = `<div class="text-center text-xs text-slate-400 py-4">لا توجد حسابات بعد. أضف حساباً من الأعلى.</div>`;
        return;
      }

      state.accounts.forEach(acc => {
        const card = document.createElement('div');
        card.className = `bg-slate-950/90 border ${acc.active ? 'border-slate-800' : 'border-slate-800/50 opacity-60'} rounded-xl p-3 space-y-2.5`;
        card.innerHTML = `
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <div>
              <label class="text-[10px] text-slate-400 block mb-0.5">اسم الحساب</label>
              <input type="text" data-edit-name="${acc.id}" value="${escapeHtml(acc.name)}" class="w-full rounded-lg bg-slate-900 border border-slate-700 focus:border-sky-500 focus:outline-none px-2.5 py-1.5 text-xs font-bold text-white" />
            </div>
            <div>
              <label class="text-[10px] text-slate-400 block mb-0.5">الرصيد الحالي ($)</label>
              <input type="number" step="any" data-edit-usd="${acc.id}" value="${Number(acc.usd) || 0}" class="w-full rounded-lg bg-slate-900 border border-slate-700 focus:border-emerald-500 focus:outline-none px-2.5 py-1.5 text-xs font-extrabold text-emerald-400 num-font" />
            </div>
          </div>
          <div class="flex items-center justify-between pt-1 border-t border-slate-800/70 gap-2 flex-wrap">
            <label class="flex items-center gap-1.5 cursor-pointer select-none">
              <input type="checkbox" data-toggle-active="${acc.id}" ${acc.active ? 'checked' : ''} class="w-4 h-4 rounded accent-emerald-500 cursor-pointer" />
              <span class="text-[11px] font-bold ${acc.active ? 'text-emerald-400' : 'text-slate-400'}">${acc.active ? 'مفعل في اللوحة' : 'مخفي / معطل'}</span>
            </label>
            <div class="flex items-center gap-2">
              <button type="button" data-save-acc="${acc.id}" class="px-2.5 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-[10px] font-bold text-white transition">حفظ التعديل</button>
              <button type="button" data-delete-acc="${acc.id}" class="px-2.5 py-1 rounded-lg bg-rose-600/20 hover:bg-rose-600/40 text-[10px] font-bold text-rose-400 transition">حذف</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    document.getElementById('addAccountForm').addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('newAccName').value.trim();
      const usd = parseFloat(document.getElementById('newAccUsd').value) || 0;
      if (!name) return;

      state.accounts.push({
        id: 'acc_' + Date.now(),
        name,
        usd: Number(usd.toFixed(2)),
        active: true
      });

      saveAndSync();
      renderAccounts();
      document.getElementById('newAccName').value = '';
      document.getElementById('newAccUsd').value = '';
      showToast(`تمت إضافة حساب (${name}) ومزامنته ✓`);
    });

    document.getElementById('accountsListContainer').addEventListener('click', e => {
      const saveBtn = e.target.closest('button[data-save-acc]');
      if (saveBtn) {
        const id = saveBtn.getAttribute('data-save-acc');
        const acc = state.accounts.find(a => a.id === id);
        if (!acc) return;
        const nameIn = document.querySelector(`input[data-edit-name="${id}"]`);
        const usdIn = document.querySelector(`input[data-edit-usd="${id}"]`);
        if (nameIn && nameIn.value.trim()) acc.name = nameIn.value.trim();
        if (usdIn) acc.usd = Number((parseFloat(usdIn.value) || 0).toFixed(2));
        saveAndSync();
        renderAccounts();
        showToast('تم حفظ تعديل الحساب ومزامنته ✓');
        return;
      }

      const delBtn = e.target.closest('button[data-delete-acc]');
      if (delBtn) {
        const id = delBtn.getAttribute('data-delete-acc');
        const acc = state.accounts.find(a => a.id === id);
        if (!acc) return;
        if (!confirm(`هل أنت متأكد من حذف حساب "${acc.name}"؟`)) return;
        state.accounts = state.accounts.filter(a => a.id !== id);
        saveAndSync();
        renderAccounts();
        showToast('تم حذف الحساب ومزامنة التغيير');
      }
    });

    document.getElementById('accountsListContainer').addEventListener('change', e => {
      const toggle = e.target.closest('input[data-toggle-active]');
      if (!toggle) return;
      const id = toggle.getAttribute('data-toggle-active');
      const acc = state.accounts.find(a => a.id === id);
      if (!acc) return;
      acc.active = toggle.checked;
      saveAndSync();
      renderAccounts();
      showToast(acc.active ? 'تم تفعيل الحساب ✓' : 'تم إخفاء الحساب');
    });

    document.getElementById('dbUrlInput').value = dbConfig.dbUrl || HARDCODED_FIREBASE_URL;
    document.getElementById('secretKeyInput').value = dbConfig.secretKey || HARDCODED_SECRET_KEY;

    document.getElementById('cloudConfigForm').addEventListener('submit', e => {
      e.preventDefault();
      dbConfig = {
        dbUrl: document.getElementById('dbUrlInput').value.trim(),
        secretKey: document.getElementById('secretKeyInput').value.trim() || 'my_balances'
      };
      try { localStorage.setItem(DB_CONFIG_KEY, JSON.stringify(dbConfig)); } catch (err) {}
      showToast('تم حفظ إعدادات السحابة ✓');
      pullStateFromCloud(true);
    });

    document.getElementById('forcePullBtn').addEventListener('click', () => pullStateFromCloud(true));
    document.getElementById('forcePushBtn').addEventListener('click', () => {
      if (!confirm('سيتم رفع النسخة الموجودة على هذا الجهاز إلى السحابة. متابعة؟')) return;
      pushStateToCloud(true);
    });

    renderAccounts();
    pullStateFromCloud(false);
  </script>
</body>
</html>
